<script>
/* Mode gelap: hormati pilihan eksplisit pembaca, kalau tidak ikuti setelan sistem. */
(function(){
  var root = document.documentElement;
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function apply(){
    var t = root.getAttribute('data-theme');
    root.classList.toggle('dark', (t === 'dark') || (t !== 'light' && mq.matches));
  }
  apply();
  try { mq.addEventListener('change', apply); } catch(e){ if(mq.addListener) mq.addListener(apply); }
  try { new MutationObserver(apply).observe(root, {attributes:true, attributeFilter:['data-theme']}); } catch(e){}
})();
</script>

<script type="text/babel" data-presets="react">
/* =========================================================================
   Deutschklasse XII ULW — Modul Mandiri Bahasa Jerman A1
   SMKN 1 Sewon · SPA satu berkas, tanpa build-step
   ========================================================================= */

/* ---- Endpoint koreksi esai. Isi dengan URL Web App Google Apps Script.
   Kunci API AI TIDAK PERNAH ditulis di berkas ini — semuanya di sisi GAS. ---- */
const GAS_URL = "https://script.google.com/macros/s/AKfycbzzLvFnx6JdpUrDpVvh_TYHlBkoVF9Cz50JOSjnr0o8gZHai_fjGY8tZzK9PFXUF1Pk/exec";

/* Bobot nilai akhir. Ubah di sini kalau ingin komposisi lain. */
const BOBOT_OBJEKTIF = 0.8;
const BOBOT_ESAI = 0.2;
const LULUS_MIN = 60;

const { useState, useRef, useEffect } = React;

/* =========================================================================
   UTIL
   ========================================================================= */
function norm(s) {
  return String(s == null ? "" : s)
    .toLowerCase()
    .replace(/ß/g, "ss")
    .replace(/ä/g, "a").replace(/ö/g, "o").replace(/ü/g, "u")
    .replace(/[.,!?;:’'“”·]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

/* =========================================================================
   KOMPONEN KECIL
   ========================================================================= */
function Eyebrow({ children }) {
  return (
    <span className="font-mono text-[.74rem] tracking-[.12em] uppercase text-ink3 dark:text-ink3D font-semibold">
      {children}
    </span>
  );
}

function Kartu({ children, className = "" }) {
  return (
    <div className={"bg-surf dark:bg-surfD border border-line dark:border-lineD rounded-md shadow-sm " + className}>
      {children}
    </div>
  );
}

function Tabel({ head, rows }) {
  return (
    <div className="tscroll overflow-x-auto mt-3 border border-line dark:border-lineD rounded-md">
      <table className="w-full text-[.9rem] border-collapse">
        <thead>
          <tr>
            {head.map((h, i) => (
              <th key={i} className="text-left px-3 py-2 bg-surf2 dark:bg-surf2D font-mono text-[.72rem] tracking-[.08em] uppercase text-ink3 dark:text-ink3D font-semibold whitespace-nowrap border-b border-line dark:border-lineD">
                {h}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.map((r, i) => (
            <tr key={i} className={r.tandai ? "bg-goldBg dark:bg-goldBgD" : ""}>
              {r.sel.map((c, j) => (
                <td key={j} className="text-left px-3 py-2 align-top border-b border-line dark:border-lineD last:border-b-0">
                  {c}
                </td>
              ))}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function De({ children }) {
  return <span className="font-mono font-medium">{children}</span>;
}
function Hi({ children }) {
  return <b className="text-gold dark:text-goldD font-semibold">{children}</b>;
}

function Sorot({ label, children }) {
  return (
    <div className="mt-3 border border-goldLine dark:border-goldLineD bg-goldBg dark:bg-goldBgD rounded p-3 text-[.92rem]">
      <span className="block mb-1 font-mono text-[.72rem] tracking-[.1em] uppercase text-gold dark:text-goldD font-semibold">
        {label}
      </span>
      {children}
    </div>
  );
}

function Contoh({ baris }) {
  return (
    <div className="mt-3 font-mono text-[.89rem] leading-relaxed bg-surf2 dark:bg-surf2D border border-line dark:border-lineD rounded p-3 flex flex-col gap-1">
      {baris.map((b, i) => <span key={i}>{b}</span>)}
    </div>
  );
}

/* ---- Video: pengantar sudah ada di atas halaman, di sini iframe-nya ---- */
function VideoBlock({ v }) {
  const url = "https://www.youtube.com/watch?v=" + v.id;
  return (
    <div className="flex flex-col gap-2">
      <div className="relative w-full aspect-video rounded-md overflow-hidden border border-line dark:border-lineD bg-surf2 dark:bg-surf2D">
        <a
          href={url}
          target="_blank"
          rel="noopener"
          className="absolute inset-0 z-0 flex flex-col items-center justify-center gap-3 text-center px-6 no-underline"
        >
          <span aria-hidden="true" className="w-14 h-14 rounded-full bg-acc dark:bg-accD grid place-items-center text-white dark:text-[#08201F] text-xl pl-[3px]">▶</span>
          <span className="text-[.9rem] text-ink2 dark:text-ink2D">Ketuk untuk menonton di YouTube</span>
        </a>
        <iframe
          className="absolute inset-0 z-10 w-full h-full"
          src={"https://www.youtube.com/embed/" + v.id}
          title={v.judul}
          frameBorder="0"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowFullScreen
          referrerPolicy="strict-origin-when-cross-origin"
        />
      </div>
      <div className="flex flex-wrap items-center gap-x-3 gap-y-1">
        <span className="text-[.875rem] text-ink3 dark:text-ink3D">{v.judul}</span>
        <a href={url} target="_blank" rel="noopener" className="text-[.875rem] font-semibold text-accInk dark:text-accInkD underline">
          Buka di YouTube ↗
        </a>
      </div>
    </div>
  );
}

/* =========================================================================
   RANGKUMAN TIAP MATERI
   ========================================================================= */
function RangkumanM1() {
  return (
    <div className="flex flex-col gap-4">
      <Kartu className="p-4 sm:p-5">
        <h3 className="font-display font-semibold text-[1.02rem] mb-2">Tiga gender kata benda</h3>
        <p className="text-[.96rem] text-ink2 dark:text-ink2D">
          Di bahasa Indonesia, meja ya meja. Di Jerman tiap kata benda bawa gender, dan gender itulah yang
          menentukan kata sandangnya. Ada tiga, ditambah satu bentuk jamak.
        </p>
        <Tabel
          head={["Gender", "Artikel tentu", "Contoh"]}
          rows={[
            { sel: [<b>Maskulin</b>, <De>der</De>, <De>der Computer · der Vater · der Apfel</De>] },
            { sel: [<b>Feminin</b>, <De>die</De>, <De>die Tasche · die Mutter · die Limonade</De>] },
            { sel: [<b>Netral</b>, <De>das</De>, <De>das Auto · das Fenster · das Buch</De>] },
            { sel: [<b>Plural</b>, <De>die</De>, <De>die Freunde · die Jungs</De>] },
          ]}
        />
        <Sorot label="Tips paling penting">
          Jangan hafal <De>Tasche</De> saja — hafalkan <De><b>die</b> Tasche</De> satu paket. Artikel yang salah
          bikin seluruh kalimat ikut salah di materi berikutnya.
        </Sorot>
      </Kartu>

      <Kartu className="p-4 sm:p-5">
        <h3 className="font-display font-semibold text-[1.02rem] mb-2">Artikel tentu vs artikel tak tentu</h3>
        <p className="text-[.96rem] text-ink2 dark:text-ink2D">
          <b>Artikel tentu</b> (<De>der/die/das</De>) untuk benda yang sudah jelas mana — mirip “itu” atau “-nya”.
          <b> Artikel tak tentu</b> (<De>ein/eine/ein</De>) berarti “sebuah” atau “seorang”, belum spesifik.
        </p>
        <Tabel
          head={["Gender", "Bestimmter (tentu)", "Unbestimmter (tak tentu)"]}
          rows={[
            { sel: ["Maskulin", <De>der Freund</De>, <De>ein Freund</De>] },
            { sel: ["Feminin", <De>die Freundin</De>, <De>eine Freundin</De>] },
            { sel: ["Netral", <De>das Auto</De>, <De>ein Auto</De>] },
            { sel: ["Plural", <De>die Freunde</De>, <span className="text-ink3 dark:text-ink3D">— tidak ada</span>] },
          ]}
        />
        <p className="text-[.96rem] text-ink2 dark:text-ink2D mt-3">
          Perhatikan: maskulin dan netral sama-sama <De>ein</De>. Yang beda sendiri cuma feminin, pakai <De>eine</De>.
          Plural memang tidak punya bentuk tak tentu — “sebuah teman-teman” kan aneh.
        </p>
      </Kartu>

      <Kartu className="p-4 sm:p-5">
        <h3 className="font-display font-semibold text-[1.02rem] mb-2">Nominativ = posisi subjek</h3>
        <p className="text-[.96rem] text-ink2 dark:text-ink2D">
          <b>Nominativ</b> adalah posisi pelaku alias subjek kalimat. Di posisi ini artikel tampil apa adanya,
          persis seperti di kamus — belum berubah sama sekali.
        </p>
        <Contoh
          baris={[
            "Der Computer ist teuer.   (Komputernya mahal)",
            "Die Tasche ist neu.       (Tasnya baru)",
            "Das Fenster ist sauber.   (Jendelanya bersih)",
            "Die Freunde sind nett.    (Teman-temannya baik)",
          ]}
        />
        <p className="text-[.96rem] text-ink2 dark:text-ink2D mt-3">
          Ingat baik-baik keempat bentuk ini. Di Materi 03 kamu akan lihat: begitu benda pindah jadi sasaran,
          hanya <b>satu</b> dari empat baris itu yang berubah.
        </p>
      </Kartu>
    </div>
  );
}

          ]}
        />

/* ---- Auto-grading 19 soal objektif ---- */
function nilaiObjektif(jawab) {
  const hasil = SOAL.map((s, i) => {
    const j = jawab[i];
    if (s.tipe === "pg") return j === s.benar;
    if (s.tipe === "bs") return j === s.benar;
    if (s.tipe === "jodoh") return j === s.benar;
    return s.acc.indexOf(norm(j)) > -1;
  });
  const benar = hasil.filter(Boolean).length;
  return { hasil, benar, total: SOAL.length, persen: Math.round((benar / SOAL.length) * 100) };
}

function Umpan({ tampil, benar, s }) {
  if (!tampil) return null;
  const cls = benar
    ? "bg-okBg dark:bg-okBgD border-ok dark:border-okD"
    : "bg-noBg dark:bg-noBgD border-no dark:border-noD";
  const lbl = benar ? "text-ok dark:text-okD" : "text-no dark:text-noD";
  return (
    <div className={"mt-3 rounded border px-3 py-[10px] text-[.9rem] " + cls}>
      <span className={"block mb-[5px] font-mono text-[.72rem] tracking-[.1em] uppercase font-semibold " + lbl}>
        {benar ? "Tepat" : "Jawaban yang benar"}
      </span>
      <div className="font-mono font-medium">{s.sol}</div>
      <div className="mt-[5px] text-ink2 dark:text-ink2D">{s.why}</div>
    </div>
  );
}

  async function kirim() {
    const obj = nilaiObjektif(jawab);
    const esaiBersih = esai.trim();
    setFase("proses");

    let skorEsai = 0;
    let feedback = "";
    let statusAI = "ok";

    if (esaiBersih.length < 15) {
      statusAI = "kosong";
      feedback = "Esaimu masih kosong atau terlalu pendek, jadi bagian ini belum bisa dinilai. Tulis 3 kalimat lalu kerjakan ulang evaluasinya.";
    } else if (!GAS_URL || GAS_URL === "ISI_URL_GAS_DISINI") {
      statusAI = "belum-diatur";
      feedback = "Koreksi otomatis belum diaktifkan oleh gurumu, jadi nilai akhirmu dihitung dari 19 soal objektif saja. Esaimu tetap tersimpan di layar ini — tunjukkan ke Herr Yudha untuk dinilai manual.";
    } else {
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 30000);
        /* Content-Type sengaja text/plain: Google Apps Script tidak menjawab
           preflight CORS, jadi permintaan harus tetap "simple request". */
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            nama: nama,
            esai: esaiBersih,
            prompt: ESAI_PROMPT,
            skorObjektif: obj.persen,
            benar: obj.benar,
            total: obj.total,
          }),
          redirect: "follow",
          signal: ctrl.signal,
        });
        clearTimeout(timer);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const n = Number(data && data.score);
        skorEsai = isFinite(n) ? Math.max(0, Math.min(100, Math.round(n))) : 0;
        feedback = (data && typeof data.feedback === "string" && data.feedback.trim())
          ? data.feedback.trim()
          : "Esaimu sudah dikoreksi, tapi catatannya kosong.";
      } catch (err) {
        statusAI = "gagal";
        feedback = "Koreksi otomatis tidak bisa dihubungi — mungkin koneksimu terputus. Nilai akhirmu untuk sementara dihitung dari 19 soal objektif saja. Coba lagi nanti, atau tunjukkan esaimu ke Herr Yudha.";
      }
    }

    const pakaiAI = statusAI === "ok";
    const nilaiAkhir = pakaiAI
      ? Math.round(obj.persen * BOBOT_OBJEKTIF + skorEsai * BOBOT_ESAI)
      : obj.persen;

    setHasil({ obj, skorEsai, feedback, statusAI, pakaiAI, nilaiAkhir, esai: esaiBersih });
    setFase("hasil");
    window.scrollTo(0, 0);
  }

  /* ---- Unduh sertifikat: tunggu React & font selesai dulu ---- */
  function unduhSertifikat() {
    if (typeof html2canvas === "undefined") { setUnduh("nolib"); return; }
    setUnduh("proses");
    const jepret = () => {
      const node = certRef.current;
      if (!node) { setUnduh("gagal"); return; }
      const w = node.offsetWidth || 600;
      const skala = Math.min(4, Math.max(2, Math.ceil(1100 / w)));
      html2canvas(node, { scale: skala, backgroundColor: "#FFFFFF", logging: false, useCORS: true })
        .then((canvas) => {
          const a = document.createElement("a");
          a.href = canvas.toDataURL("image/jpeg", 0.95);
          a.download = "Sertifikat-" + nama.replace(/[^A-Za-z0-9]+/g, "-") + ".jpg";
          document.body.appendChild(a);
          a.click();
          setTimeout(() => { if (a.parentNode) a.parentNode.removeChild(a); }, 200);
          setUnduh("selesai");
        })
        .catch(() => setUnduh("gagal"));
    };
    /* setTimeout memastikan DOM hasil render React sudah terpasang sebelum dipotret */
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => setTimeout(jepret, 120));
    else setTimeout(jepret, 300);
  }

  const judul = (
    <div className="pt-7 sm:pt-9 pb-4 border-b border-line dark:border-lineD">
      <Eyebrow>Evaluasi akhir</Eyebrow>
      <h1 className="font-display font-extrabold text-[1.7rem] sm:text-[2.3rem] leading-[1.08] tracking-[-.025em] mt-2">
        Evaluasi & Sertifikat
      </h1>
      <p className="mt-[11px] text-ink2 dark:text-ink2D max-w-[52ch]">
        Dua puluh soal dari keempat materi: 19 soal dikoreksi otomatis, 1 esai dikoreksi oleh AI Herr Yudha.
        Isi namamu dulu, lalu kerjakan.
      </p>
    </div>
  );

  /* --- Tahap 1: gerbang nama --- */
  if (!nama) {
    return (
      <section>
        {judul}
        <div className="pt-7">
          <form onSubmit={mulai} className="bg-surf dark:bg-surfD border border-line dark:border-lineD rounded-md shadow-sm p-5 flex flex-col gap-3 max-w-[30rem]">
            <label htmlFor="nama-siswa" className="font-display font-semibold text-[1.02rem]">Nama Lengkap</label>
            <p className="text-[.875rem] text-ink2 dark:text-ink2D">
              Nama ini yang akan tercetak di sertifikat. Tulis seperti di absen, bukan nama panggilan.
            </p>
            <input
              id="nama-siswa" type="text" value={draft} autoComplete="name"
              placeholder="Contoh: Nimas Dinda Fatikasari"
              onChange={(e) => setDraft(e.target.value)}
              className="font-sans text-base bg-surf dark:bg-surfD text-ink dark:text-inkD border border-lineS dark:border-lineSD rounded px-[10px] py-[9px] min-h-[44px] w-full"
            />
            {salahNama && <p className="text-[.875rem] font-semibold text-no dark:text-noD">{salahNama}</p>}
            <button type="submit" className="self-start font-sans text-[.96rem] font-bold rounded px-5 py-3 min-h-[48px] bg-acc dark:bg-accD text-white dark:text-[#08201F] hover:brightness-110 cursor-pointer">
              Mulai Evaluasi
            </button>
            <p className="text-[.875rem] text-ink3 dark:text-ink3D">
              Namamu cuma dipakai untuk sertifikat dan tidak disimpan di server sekolah.
            </p>
          </form>
        </div>
      </section>
    );
  }

  /* --- Tahap 2: memproses --- */
  if (fase === "proses") {
    return (
      <section>
        {judul}
        <div className="pt-16 pb-16 flex flex-col items-center text-center gap-4">
          <div className="w-12 h-12 rounded-full border-4 border-line dark:border-lineD border-t-acc dark:border-t-accD animate-spin" />
          <p className="font-display font-semibold text-[1.1rem]">AI Herr Yudha sedang mengoreksi esaimu…</p>
          <p className="text-[.95rem] text-ink2 dark:text-ink2D max-w-[36ch]">
            Sebentar ya, biasanya cuma beberapa detik. Jangan tutup halaman ini dulu.
          </p>
        </div>
      </section>
    );
  }

  /* --- Tahap 3: hasil + sertifikat --- */
  if (fase === "hasil" && hasil) {
    const lulus = hasil.nilaiAkhir >= LULUS_MIN;
    return (
      <section>
        {judul}

        <div className="pt-7">
          <div className="border border-acc dark:border-accD bg-accSoft dark:bg-accSoftD rounded-md p-5">
            <Eyebrow>Nilai akhir</Eyebrow>
            <div className="font-display font-extrabold text-[2.6rem] leading-none tracking-[-.03em] text-accInk dark:text-accInkD mt-1">
              {hasil.nilaiAkhir} / 100
            </div>
            <p className="mt-3 text-[.95rem]">
              {lulus
                ? "Selamat, kamu tuntas! Sertifikatmu sudah siap di bawah."
                : "Nilaimu masih di bawah " + LULUS_MIN + ". Sertifikat tetap bisa diunduh, tapi enaknya ulangi dulu biar angkanya bagus."}
            </p>
            <div className="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div className="bg-surf dark:bg-surfD border border-line dark:border-lineD rounded p-3">
                <Eyebrow>Objektif · bobot {Math.round(BOBOT_OBJEKTIF * 100)}%</Eyebrow>
                <div className="font-display font-bold text-[1.3rem] mt-1">
                  {hasil.obj.benar} / {hasil.obj.total} benar
                </div>
                <div className="text-[.9rem] text-ink2 dark:text-ink2D">setara nilai {hasil.obj.persen}</div>
              </div>
              <div className="bg-surf dark:bg-surfD border border-line dark:border-lineD rounded p-3">
                <Eyebrow>Esai · bobot {Math.round(BOBOT_ESAI * 100)}%</Eyebrow>
                <div className="font-display font-bold text-[1.3rem] mt-1">
                  {hasil.pakaiAI ? hasil.skorEsai + " / 100" : "Belum dinilai"}
                </div>
                <div className="text-[.9rem] text-ink2 dark:text-ink2D">
                  {hasil.pakaiAI ? "dinilai AI Herr Yudha" : "nilai akhir dari objektif saja"}
                </div>
              </div>
            </div>
          </div>
        </div>

        <div className="pt-7">
          <h2 className="font-display font-extrabold text-[1.25rem] sm:text-[1.5rem] tracking-[-.02em] mb-3">
            Catatan untuk esaimu
          </h2>
          {hasil.esai && (
            <div className="bg-surf2 dark:bg-surf2D border border-line dark:border-lineD rounded p-3 font-mono text-[.9rem] mb-3 whitespace-pre-wrap">
              {hasil.esai}
            </div>
          )}
          <div className={"rounded border p-4 text-[.95rem] leading-relaxed " +
            (hasil.pakaiAI
              ? "bg-surf dark:bg-surfD border-line dark:border-lineD"
              : "bg-goldBg dark:bg-goldBgD border-goldLine dark:border-goldLineD")}>
            {hasil.feedback}
          </div>
        </div>

        <div className="pt-8">
          <h2 className="font-display font-extrabold text-[1.25rem] sm:text-[1.5rem] tracking-[-.02em] mb-3">
            Sertifikat
          </h2>
          <div className="max-w-[34rem]">
            <Sertifikat nodeRef={certRef} nama={nama} nilai={hasil.nilaiAkhir} tgl={tgl} />
          </div>
          <div className="flex flex-wrap gap-[10px] items-center mt-4">
            <button
              type="button"
              onClick={unduhSertifikat}
              className="font-sans text-[.96rem] font-bold rounded px-5 py-3 min-h-[48px] bg-acc dark:bg-accD text-white dark:text-[#08201F] hover:brightness-110 cursor-pointer"
            >
              {unduh === "proses" ? "Menyiapkan gambar…" : "Unduh Sertifikat (JPG)"}
            </button>
            <button
              type="button"
              onClick={() => { setJawab({}); setEsai(""); setHasil(null); setUnduh(""); setFase("isi"); window.scrollTo(0, 0); }}
              className="font-sans text-[.96rem] font-bold rounded px-5 py-3 min-h-[48px] bg-transparent text-ink2 dark:text-ink2D border border-lineS dark:border-lineSD hover:bg-surf2 dark:hover:bg-surf2D cursor-pointer"
            >
              Ulangi evaluasi
            </button>
          </div>
          {unduh === "selesai" && <p className="text-[.875rem] text-ok dark:text-okD mt-2 font-semibold">Sertifikat tersimpan di folder unduhan perangkatmu.</p>}
          {unduh === "gagal" && <p className="text-[.875rem] text-no dark:text-noD mt-2">Gambarnya gagal dibuat. Muat ulang halaman lalu coba lagi, atau screenshot sertifikat di atas.</p>}
          {unduh === "nolib" && <p className="text-[.875rem] text-no dark:text-noD mt-2">Alat pembuat gambar belum termuat — koneksimu mungkin terputus. Muat ulang halaman, atau screenshot sertifikat di atas.</p>}
        </div>

        <div className="pt-8">
          <h2 className="font-display font-extrabold text-[1.25rem] sm:text-[1.5rem] tracking-[-.02em] mb-3">
            Pembahasan 19 soal objektif
          </h2>
          <div className="flex flex-col gap-4">
            {SOAL.map((s, i) => (
              <KotakSoal
                key={i}
                nomor={i + 1}
                label={BAGIAN.filter((b) => b.tipe === s.tipe)[0].judul}
                status={hasil.obj.hasil[i] ? "benar" : "salah"}
                umpan={<Umpan tampil={true} benar={hasil.obj.hasil[i]} s={s} />}
              >
                <p className="text-[.95rem] text-ink2 dark:text-ink2D">
                  {s.tipe === "susun" ? s.kata.join(" · ") : s.q}
                </p>
              </KotakSoal>
            ))}
          </div>
        </div>
      </section>
    );
  }

  /* --- Tahap 2a: mengerjakan --- */
  return (
    <section>
      {judul}

      <div className="pt-6 flex flex-wrap items-center gap-3">
        <span className="text-[.95rem] text-ink2 dark:text-ink2D">
          Peserta: <b className="text-ink dark:text-inkD">{nama}</b>
        </span>
        <button
          type="button"
          onClick={() => { setNama(""); setDraft(""); }}
          className="text-[.875rem] font-semibold text-accInk dark:text-accInkD underline cursor-pointer bg-transparent border-0 p-0"
        >
          Ganti nama
        </button>
      </div>

      {BAGIAN.map((bag) => {
        const daftar = SOAL.map((s, i) => ({ s, i })).filter((x) => x.s.tipe === bag.tipe);
        return (
          <div key={bag.tipe} className="pt-8">
            <h2 className="font-display font-extrabold text-[1.15rem] sm:text-[1.35rem] tracking-[-.02em]">{bag.judul}</h2>
            <p className="text-ink2 dark:text-ink2D text-[.95rem] mt-1 mb-3 max-w-[56ch]">{bag.petunjuk}</p>

            {bag.tipe === "jodoh" && (
              <div className="mb-3 border border-dashed border-lineS dark:border-lineSD rounded p-3 bg-surf2 dark:bg-surf2D">
                <span className="block mb-2 font-mono text-[.72rem] tracking-[.1em] uppercase text-ink3 dark:text-ink3D font-semibold">
                  Pilihan jawaban
                </span>
                <div className="flex flex-wrap gap-2">
                  {BANK_JODOH.map((b) => (
                    <span key={b.kunci} className="font-mono text-[.9rem] bg-surf dark:bg-surfD border border-line dark:border-lineD rounded px-[9px] py-1">
                      {b.kunci}. {b.teks}
                    </span>
                  ))}
                </div>
              </div>
            )}

            <div className="flex flex-col gap-4">
              {daftar.map(({ s, i }) => (
                <KotakSoal key={i} nomor={i + 1} label={bag.judul}>
                  {s.tipe === "pg" && (
                    <div>
                      <p className="text-[.95rem] text-ink2 dark:text-ink2D mb-1">
                        <b className="font-mono text-ink dark:text-inkD">{s.q}</b>
                      </p>
                      {s.hint && <p className="text-[.875rem] text-ink3 dark:text-ink3D mb-3">({s.hint})</p>}
                      <div className="flex flex-col gap-2" role="radiogroup" aria-label={"Soal " + (i + 1)}>
                        {s.opts.map((o, k) => (
                          <label
                            key={k}
                            className={"flex items-center gap-3 border rounded px-3 py-[10px] min-h-[44px] cursor-pointer bg-surf dark:bg-surfD hover:bg-surf2 dark:hover:bg-surf2D " +
                              (jawab[i] === k ? "border-acc dark:border-accD bg-accSoft dark:bg-accSoftD" : "border-lineS dark:border-lineSD")}
                          >
                            <input
                              type="radio" name={"pg-" + i} checked={jawab[i] === k}
                              onChange={() => setJ(i, k)}
                              className="w-[18px] h-[18px] flex-none accent-acc dark:accent-accD cursor-pointer"
                            />
                            <span className="font-mono font-semibold text-ink3 dark:text-ink3D text-[.86rem] w-[1.1em] flex-none">
                              {"ABCDE".charAt(k)}
                            </span>
                            <span className="font-mono text-[.96rem]">{o}</span>
                          </label>
                        ))}
                      </div>
                    </div>
                  )}

                  {s.tipe === "bs" && (
                    <div>
                      <p className="text-[.95rem] text-ink2 dark:text-ink2D mb-3">
                        <b className="font-mono text-ink dark:text-inkD">{s.q}</b>
                      </p>
                      <div className="flex flex-wrap gap-2" role="radiogroup" aria-label={"Soal " + (i + 1)}>
                        {[["Richtig", true], ["Falsch", false]].map((o) => (
                          <label
                            key={String(o[1])}
                            className={"flex-1 min-w-[130px] flex items-center gap-3 border rounded px-3 py-[10px] min-h-[44px] cursor-pointer bg-surf dark:bg-surfD hover:bg-surf2 dark:hover:bg-surf2D " +
                              (jawab[i] === o[1] ? "border-acc dark:border-accD bg-accSoft dark:bg-accSoftD" : "border-lineS dark:border-lineSD")}
                          >
                            <input
                              type="radio" name={"bs-" + i} checked={jawab[i] === o[1]}
                              onChange={() => setJ(i, o[1])}
                              className="w-[18px] h-[18px] flex-none accent-acc dark:accent-accD cursor-pointer"
                            />
                            <span className="font-mono text-[.96rem]">{o[0]}</span>
                          </label>
                        ))}
                      </div>
                    </div>
                  )}

                  {s.tipe === "jodoh" && (
                    <div className="flex flex-col gap-2">
                      <p className="font-mono text-[.95rem]">{s.q}</p>
                      {s.hint && <p className="text-[.875rem] text-ink3 dark:text-ink3D">({s.hint})</p>}
                      <select
                        value={jawab[i] || ""}
                        onChange={(e) => setJ(i, e.target.value)}
                        aria-label={"Jawaban soal " + (i + 1)}
                        className="font-mono text-base bg-surf dark:bg-surfD text-ink dark:text-inkD border border-lineS dark:border-lineSD rounded px-[10px] py-[9px] min-h-[44px] max-w-[220px]"
                      >
                        <option value="">— pilih —</option>
                        {BANK_JODOH.map((b) => (
                          <option key={b.kunci} value={b.kunci}>{b.kunci}. {b.teks}</option>
                        ))}
                      </select>
                    </div>
                  )}

                  {(s.tipe === "rumpang" || s.tipe === "ubah" || s.tipe === "susun") && (
                    <div className="flex flex-col gap-2">
                      {s.tipe === "susun" ? (
                        <div className="flex flex-wrap gap-2 mb-1">
                          {s.kata.map((w, k) => (
                            <span key={k} className="font-mono text-[.94rem] font-medium bg-surf2 dark:bg-surf2D border border-lineS dark:border-lineSD rounded px-[11px] py-[6px]">
                              {w}
                            </span>
                          ))}
                        </div>
                      ) : (
                        <p className="font-mono text-[.95rem]">{s.q.replace("__", "\u2005______\u2005")}</p>
                      )}
                      {s.instruksi && <p className="text-[.9rem] text-ink2 dark:text-ink2D">{s.instruksi}</p>}
                      {s.hint && <p className="text-[.875rem] text-ink3 dark:text-ink3D">({s.hint})</p>}
                      <input
                        type="text" value={jawab[i] || ""} autoComplete="off"
                        placeholder={s.tipe === "rumpang" ? "Isi bagian yang kosong…" : "Tulis kalimat lengkapnya…"}
                        onChange={(e) => setJ(i, e.target.value)}
                        aria-label={"Jawaban soal " + (i + 1)}
                        className="font-mono text-base bg-surf dark:bg-surfD text-ink dark:text-inkD border border-lineS dark:border-lineSD rounded px-[10px] py-[9px] min-h-[44px] w-full"
                      />
                    </div>
                  )}
                </KotakSoal>
              ))}
            </div>
          </div>
        );
      })}

      {/* Soal 20: esai */}
      <div className="pt-8">
        <h2 className="font-display font-extrabold text-[1.15rem] sm:text-[1.35rem] tracking-[-.02em]">G · Esai Pendek</h2>
        <p className="text-ink2 dark:text-ink2D text-[.95rem] mt-1 mb-3 max-w-[56ch]">
          Bagian ini dikoreksi oleh AI Herr Yudha, bukan oleh sistem penilaian otomatis.
        </p>
        <KotakSoal nomor={20} label="G · Esai Pendek">
          <p className="text-[.95rem] text-ink2 dark:text-ink2D mb-3">{ESAI_PROMPT}</p>
          <textarea
            rows={5} value={esai} onChange={(e) => setEsai(e.target.value)}
            aria-label="Jawaban esai"
            placeholder="Ich spiele gern Fußball. …"
            className="font-mono text-base leading-relaxed bg-surf dark:bg-surfD text-ink dark:text-inkD border border-lineS dark:border-lineSD rounded px-[10px] py-[9px] w-full resize-y"
          />
          <p className="text-[.875rem] text-ink3 dark:text-ink3D mt-2">
            {esai.trim().length} huruf · minimal 15 huruf supaya bisa dinilai
          </p>
        </KotakSoal>
      </div>

      <div className="pt-7 pb-4 flex flex-wrap gap-3 items-center">
        <button
          type="button"
          onClick={kirim}
          className="font-sans text-[.96rem] font-bold rounded px-5 py-3 min-h-[48px] bg-acc dark:bg-accD text-white dark:text-[#08201F] hover:brightness-110 cursor-pointer"
        >
          Submit & Koreksi
        </button>
        <span className="text-[.875rem] text-ink2 dark:text-ink2D">
          {terisi} dari {SOAL.length} soal objektif terisi
        </span>
      </div>
    </section>
  );
}

            <span>Deutschklasse<span className="hidden min-[390px]:inline"> XII ULW</span></span>
          </button>
        </div>
        <nav aria-label="Navigasi materi" className="flex gap-2 overflow-x-auto pb-1 mt-2 -mx-1 px-1">
          {MATERI.map((m, i) => item(i, "Materi " + m.no))}
          {item(4, "Evaluasi")}
        </nav>
      </div>
    </header>
  );
}

function App() {
  const [aktif, setAktif] = useState(0);

  useEffect(() => {
    const nama = aktif < 4 ? "Materi " + MATERI[aktif].no + " · " + MATERI[aktif].judul : "Evaluasi & Sertifikat";
    document.title = nama + " · Deutschklasse XII ULW";
  }, [aktif]);

  return (
    <div>
      <Nav aktif={aktif} setAktif={setAktif} />
      <div className="max-w-[56rem] mx-auto px-4 sm:px-7 pb-20">
        <main>
          {aktif < 4 ? (
            <HalamanMateri
              m={MATERI[aktif]}
              onLanjut={() => { setAktif(aktif + 1); window.scrollTo(0, 0); }}
              labelLanjut={aktif < 3 ? "Materi " + MATERI[aktif + 1].no + " · " + MATERI[aktif + 1].judul : "Evaluasi & Sertifikat"}
            />
          ) : (
            <HalamanEvaluasi />
          )}
        </main>
        <footer className="mt-12 pt-[18px] border-t border-line dark:border-lineD text-ink3 dark:text-ink3D text-[.875rem] flex flex-col gap-1">
          <span className="font-semibold text-ink2 dark:text-ink2D">Dikembangkan untuk SMKN 1 Sewon | Viel Erfolg, kelas 12!</span>
          <span>Bahasa Jerman · Kelas XII ULW · Fase F · Tahun Pelajaran 2026/2027 · Herr Yudha Nur Wicaksono</span>
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>
</html>
